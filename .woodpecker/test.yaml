# Mirror of the `test` job in .github/workflows/ci.yml, run on the self-hosted Woodpecker agent.
when:
  - event: push
    branch: [main, ci/*]
  - event: pull_request

matrix:
  NODE:
    - 22
    - 24

steps:
  - name: test-node-${NODE}
    image: node:${NODE}-bookworm
    environment:
      CI: "true"
    commands:
      - corepack enable
      - cd engine
      - pnpm install --frozen-lockfile
      - pnpm typecheck
      # The agent is a home server that also runs other services, and both matrix entries run at once:
      # fewer workers and a longer per-test limit than GitHub's defaults (5 s timed out at 5.1-8.4 s).
      - pnpm test --maxWorkers=2 --testTimeout=20000
      - pnpm knip
      - pnpm dup
      - pnpm lint
      - pnpm build
